# Local development docker-compose for eLabFTW
# Usage: docker compose -f docker-compose.dev.yml up -d
name: elabftw-dev

networks:
  elabftw-net:

services:
  web:
    image: elabftw/elabimg:aemoor-v2
    container_name: elabftw
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=elabftw
      - SECRET_KEY=def00000195a92432f2ebb86bf6e9b9646b45ea955cab7b8f2d96ba2259a85c9e09b04647078c425c5392cb631fa3d9816974bbe8e458d61e16f897ef36c0def362458fd
      - SERVER_NAME=localhost
      - DISABLE_HTTPS=false
      - ENABLE_LETSENCRYPT=false
      - SITE_URL=https://localhost:3148
      - PHP_TIMEZONE=America/New_York
      - TZ=America/New_York
      - MAX_PHP_MEMORY=512M
      - DEV_MODE=true
    ports:
      - '3148:443'
    volumes:
      # Mount local source code into the container
      #- .:/elabftw
      # Use a named volume for uploads persistence
      - elabftw-uploads:/elabftw/uploads
    tmpfs:
      - /elabftw/cache:uid=101,gid=101
    networks:
      - elabftw-net

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - SYS_CHROOT
      - SETFCAP
      - NET_RAW
    environment:
      - MYSQL_ROOT_PASSWORD=elabftw
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=elabftw
      - TZ=America/New_York
    volumes:
      - elabftw-mysql:/var/lib/mysql
    expose:
      - '3306'
    networks:
      - elabftw-net

volumes:
  elabftw-uploads:
  elabftw-mysql:
