name: elabftw-codex-scalability

services:
  storage-init:
    image: alpine:3.23
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        chown ${ELABFTW_RUN_UID:-1000}:${ELABFTW_RUN_GID:-1000}
        /var/lib/elabftw/uploads /var/lib/elabftw/exports
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - elabftw-uploads:/var/lib/elabftw/uploads
      - elabftw-exports:/var/lib/elabftw/exports

  migration-init:
    image: elabftw/elabimg:codex-usability-improvements
    build:
      context: .
      dockerfile: containers/elabimg/Dockerfile
      args:
        BUILD_ALL: "1"
        NODE_MAX_OLD_SPACE_SIZE: "${NODE_MAX_OLD_SPACE_SIZE:-4096}"
    user: "${ELABFTW_RUN_UID:-1000}:${ELABFTW_RUN_GID:-1000}"
    read_only: true
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: elabftw
      DB_USER: elabftw
      DB_PASSWORD: ${ELABFTW_DB_PASSWORD}

      SECRET_KEY: ${ELABFTW_SECRET_KEY}
      SERVER_NAME: ${ELABFTW_SERVER_NAME:-localhost}
      SITE_URL: ${ELABFTW_SITE_URL:-https://localhost:3150}

      DISABLE_HTTPS: "false"
      ENABLE_LETSENCRYPT: "false"
      PHP_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
      MAX_PHP_MEMORY: 512M
      DEV_MODE: "false"

      # The one-shot job applies official migrations before custom migrations.
      AUTO_DB_INIT: "true"
      AUTO_DB_UPDATE: "true"

    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        mkdir -p /run/s6/container_environment
        && /usr/sbin/docker-entrypoint.sh
        && exec /elabftw/bin/console custom:db:update

    volumes:
      - elabftw-uploads:/var/lib/elabftw/uploads
      - elabftw-exports:/var/lib/elabftw/exports

    tmpfs:
      - /run:mode=755,uid=${ELABFTW_RUN_UID:-1000},gid=${ELABFTW_RUN_GID:-1000},exec,nosuid,nodev
      - /var/cache/nginx:mode=755,uid=${ELABFTW_RUN_UID:-1000},gid=${ELABFTW_RUN_GID:-1000},noexec,nosuid,nodev

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE

    networks:
      - elabftw-net

  web:
    image: elabftw/elabimg:codex-usability-improvements
    build:
      context: .
      dockerfile: containers/elabimg/Dockerfile
      args:
        BUILD_ALL: "1"
        NODE_MAX_OLD_SPACE_SIZE: "${NODE_MAX_OLD_SPACE_SIZE:-4096}"
    user: "${ELABFTW_RUN_UID:-1000}:${ELABFTW_RUN_GID:-1000}"
    read_only: true
    restart: unless-stopped
    depends_on:
      migration-init:
        condition: service_completed_successfully

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: elabftw
      DB_USER: elabftw
      DB_PASSWORD: ${ELABFTW_DB_PASSWORD}

      SECRET_KEY: ${ELABFTW_SECRET_KEY}
      SERVER_NAME: ${ELABFTW_SERVER_NAME:-localhost}
      SITE_URL: ${ELABFTW_SITE_URL:-https://localhost:3150}

      DISABLE_HTTPS: "false"
      ENABLE_LETSENCRYPT: "false"
      PHP_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
      MAX_PHP_MEMORY: 512M
      DEV_MODE: "false"

      # The one-shot migration service owns initialization and upgrades.
      AUTO_DB_INIT: "false"
      AUTO_DB_UPDATE: "false"

    ports:
      - "${ELABFTW_BIND_ADDRESS:-127.0.0.1}:${ELABFTW_HTTPS_PORT:-3150}:8080"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl -skf https://localhost:8080/healthcheck.php)" = "ok"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    mem_limit: ${ELABFTW_WEB_MEMORY_LIMIT:-2g}
    cpus: ${ELABFTW_WEB_CPUS:-2.0}

    logging:
      driver: json-file
      options:
        max-size: ${ELABFTW_LOG_MAX_SIZE:-10m}
        max-file: ${ELABFTW_LOG_MAX_FILES:-5}

    volumes:
      - elabftw-uploads:/var/lib/elabftw/uploads
      - elabftw-exports:/var/lib/elabftw/exports

    tmpfs:
      - /run:mode=755,uid=${ELABFTW_RUN_UID:-1000},gid=${ELABFTW_RUN_GID:-1000},exec,nosuid,nodev
      - /var/cache/nginx:mode=755,uid=${ELABFTW_RUN_UID:-1000},gid=${ELABFTW_RUN_GID:-1000},noexec,nosuid,nodev

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE

    networks:
      - elabftw-net

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${ELABFTW_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: elabftw
      MYSQL_USER: elabftw
      MYSQL_PASSWORD: ${ELABFTW_DB_PASSWORD}
      TZ: Europe/Zurich

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 30

    mem_limit: ${ELABFTW_MYSQL_MEMORY_LIMIT:-2g}
    cpus: ${ELABFTW_MYSQL_CPUS:-2.0}

    logging:
      driver: json-file
      options:
        max-size: ${ELABFTW_LOG_MAX_SIZE:-10m}
        max-file: ${ELABFTW_LOG_MAX_FILES:-5}

    volumes:
      - elabftw-mysql:/var/lib/mysql

    networks:
      - elabftw-net

  maintenance:
    profiles:
      - maintenance
    image: elabftw/elabimg:codex-usability-improvements
    build:
      context: .
      dockerfile: containers/elabimg/Dockerfile
      args:
        BUILD_ALL: "1"
        NODE_MAX_OLD_SPACE_SIZE: "${NODE_MAX_OLD_SPACE_SIZE:-4096}"
    user: "${ELABFTW_RUN_UID:-1000}:${ELABFTW_RUN_GID:-1000}"
    read_only: true
    restart: "no"
    depends_on:
      migration-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: elabftw
      DB_USER: elabftw
      DB_PASSWORD: ${ELABFTW_DB_PASSWORD}
      SOURCE_COMMIT: ${ELABFTW_BUILD_COMMIT:-unknown}
      SECRET_KEY: ${ELABFTW_SECRET_KEY}
      SERVER_NAME: ${ELABFTW_SERVER_NAME:-localhost}
      SITE_URL: ${ELABFTW_SITE_URL:-https://localhost:3150}
      DISABLE_HTTPS: "false"
      ENABLE_LETSENCRYPT: "false"
      PHP_TIMEZONE: ${ELABFTW_TIMEZONE:-Europe/Zurich}
      TZ: ${ELABFTW_TIMEZONE:-Europe/Zurich}
      DEV_MODE: "false"
    entrypoint:
      - /usr/bin/php
      - /elabftw/bin/console
    command:
      - custom:maintenance
    tmpfs:
      - /run:mode=755,uid=${ELABFTW_RUN_UID:-1000},gid=${ELABFTW_RUN_GID:-1000},exec,nosuid,nodev
    cap_drop:
      - ALL
    networks:
      - elabftw-net

  backup:
    profiles:
      - backup
    build:
      context: .
      dockerfile: containers/backup/Dockerfile
    image: elabftw/backup:codex-operations-hardening
    user: "${ELABFTW_RUN_UID:-1000}:${ELABFTW_RUN_GID:-1000}"
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: elabftw
      DB_USER: elabftw
      DB_PASSWORD: ${ELABFTW_DB_PASSWORD}
    volumes:
      - elabftw-uploads:/source/uploads
      - elabftw-exports:/source/exports
      - ${ELABFTW_BACKUP_PATH:-./backups}:/backups
    cap_drop:
      - ALL
    networks:
      - elabftw-net

networks:
  elabftw-net:

volumes:
  elabftw-uploads:
  elabftw-exports:
  elabftw-mysql:
