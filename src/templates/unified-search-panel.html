{# Unified search side panel — mirrors structure of toc-panel.html #}
<div class='side-panel' id='unifiedSearchPanel' hidden>
  <button type='button' data-action='toggle-sidepanel' data-target='unified-search' data-purpose='hide' aria-label='{{ 'Close'|trans }}' title='{{ 'Close'|trans }}' class='btn float-right mr-2'><i class='fas fa-xmark fa-2x'></i></button>
  <div class='p-3'>
    <h3 class='mb-3'>{{ 'Search'|trans }}</h3>
    <div class='input-group input-group-sm mb-3'>
      <label class='sr-only' for='unifiedSearchInput'>{{ 'Search experiments, resources, tags, tasks, folders and headings'|trans }}</label>
      <div class='input-group-prepend'>
        <span class='input-group-text'><i class='fas fa-search fa-fw' aria-hidden='true'></i></span>
      </div>
      <input type='search' id='unifiedSearchInput' class='form-control' placeholder='{{ 'Search everything…'|trans }}' autocomplete='off'>
    </div>
    {# this will be filled with grouped results by UnifiedSearchPanel.class.ts #}
    <div id='unifiedSearchResults'></div>
  </div>
</div>
