{% import 'guide-info.html' as guide -%}
<div class='side-panel' id='foldersPanel' data-lazy-folders-panel hidden>
  {# Close and Refresh: the same size and place in every side panel (see .panel-corner-btn in main.scss) #}
  <button type='button' data-action='toggle-sidepanel' data-target='folders' data-purpose='hide' aria-label='{{ 'Close'|trans }}' title='{{ 'Close'|trans }}' class='btn panel-corner-btn panel-close'><i class='fas fa-xmark fa-fw' aria-hidden='true'></i></button>
  <button type='button' data-action='refresh-folders' class='btn panel-corner-btn panel-refresh' title='{{ 'Refresh'|trans }}' aria-label='{{ 'Refresh'|trans }}'><i class='fas fa-rotate fa-fw' aria-hidden='true'></i></button>
  <div id='experimentsFoldersSidebar' class='p-3' data-current-user-id='{{ App.Users.userData.userid }}'>
    <div class='d-flex align-items-center justify-content-between mb-3'>
      <h3 class='mb-0'><i class='fas fa-folder-tree mr-2'></i>{{ 'Folders'|trans }}{{ guide.info('guide-folders', 'Folders') }}</h3>
    </div>
    <div class='d-flex align-items-center justify-content-center color-medium py-5' role='status'>
      <i class='fas fa-spinner fa-spin mr-2'></i>{{ 'Loading'|trans }}…
    </div>
  </div>
</div>
