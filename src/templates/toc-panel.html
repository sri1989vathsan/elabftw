{# Table of Contents side panel — mirrors structure of todolist-panel.html #}
<div class='side-panel' id='tocPanel' hidden>
  <button type='button' data-action='toggle-sidepanel' data-target='toc' data-purpose='hide' aria-label='{{ 'Close'|trans }}' title='{{ 'Close'|trans }}' class='btn float-right mr-2'><i class='fas fa-xmark fa-2x'></i></button>
  <div class='p-3'>
    <h3 class='mb-3 d-flex align-items-center justify-content-between'>
      <span>{{ 'Table of Contents'|trans }}</span>
      <button type='button' class='btn btn-sm btn-outline-secondary' data-action='refresh-toc' title='{{ 'Refresh'|trans }}' aria-label='{{ 'Refresh'|trans }}'>
        <i class='fas fa-sync-alt fa-fw'></i>
      </button>
    </h3>
    <div class='input-group input-group-sm mb-3'>
      <label class='sr-only' for='tocSearchInput'>{{ 'Search'|trans }} {{ 'Table of Contents'|trans }}</label>
      <div class='input-group-prepend'>
        <span class='input-group-text'><i class='fas fa-search fa-fw' aria-hidden='true'></i></span>
      </div>
      <input type='search' id='tocSearchInput' class='form-control' placeholder='{{ 'Search headings'|trans }}' autocomplete='off'>
      <div class='input-group-append'>
        <button type='button' id='tocSearchClear' class='btn btn-outline-secondary' title='{{ 'Clear'|trans }}' aria-label='{{ 'Clear'|trans }}'>
          <i class='fas fa-xmark fa-fw' aria-hidden='true'></i>
        </button>
      </div>
    </div>
    <p class='small color-medium px-2'>
      {{ 'Search also filters the main text to matching sections.'|trans }}
    </p>
    {# this will be filled with the TOC entries by TocPanel.class.ts #}
    <div id='tocItems' class='toc-items-container'></div>
    <p id='tocNoResults' class='text-muted px-2' hidden>No matching headings.</p>
  </div>
</div>
