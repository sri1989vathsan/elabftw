<!-- eLabFTW BRIDGE (pick): inserted by add-bridge.py; only active when the page runs inside eLabFTW -->
<style>
#elabPick{position:fixed;right:14px;bottom:14px;z-index:2147483647;display:none;gap:6px;align-items:center;font:600 12px/1 system-ui,sans-serif}
#elabPick button{font:inherit;padding:8px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#elabPick button.on{background:#dc2626}
#elabPick .elab-note{padding:8px 12px;border-radius:8px;background:#111827;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-weight:500}
.elab-pick-target{outline:3px solid #2563eb!important;outline-offset:2px;cursor:copy!important}
@media print{#elabPick{display:none!important}}
</style>
<script>
(function(){
  if(window.parent===window) return;
  var TARGETS='table,[class*="result"],[class*="summary"],[class*="recipe"],[class*="output"],.card,pre,li,p';
  var bar=document.createElement('div'); bar.id='elabPick'; bar.style.display='flex';
  var pick=document.createElement('button'); pick.type='button'; pick.textContent='Pick → eLabFTW';
  pick.title='Click a table or result on this page to insert it into the main text';
  var sel=document.createElement('button'); sel.type='button'; sel.textContent='Selection → eLabFTW';
  sel.title='Insert the text you have selected'; sel.style.display='none';
  var note=document.createElement('span'); note.className='elab-note'; note.style.display='none';
  bar.append(note,sel,pick); document.body.appendChild(bar);
  var picking=false, hot=null, timer=0;
  function say(t){ note.textContent=t; note.style.display=''; clearTimeout(timer); timer=setTimeout(function(){ if(!picking) note.style.display='none'; },3500); }
  function post(m){ window.parent.postMessage(Object.assign({elabftw:1},m),'*'); }
  function send(m){
    post(m);
    // a tool that works with inventory entries (window.elabftwItemLinks() -> [{id,title}]) gets them linked in the text too
    if(m.type!=='insert-text' && typeof window.elabftwItemLinks==='function'){
      var l=window.elabftwItemLinks()||[];
      if(l.length) post({type:'insert-text',text:'Inventory: '+l.map(function(i){return '[[item:'+i.id+'|'+String(i.title).replace(/[\]|]/g,' ')+']]';}).join(', ')});
    }
  }
  function clean(s){ return String(s||'').replace(/[ \t\r\f\v]+/g,' ').replace(/ ?\n ?/g,'\n').trim(); }
  function cellText(c){
    var t=clean(c.innerText).replace(/\n+/g,' '); if(t) return t;
    var f=c.querySelector('input,select,textarea'); return f? clean(f.tagName==='SELECT'? f.options[f.selectedIndex]&&f.options[f.selectedIndex].text : f.value):'';
  }
  function fromTable(t){
    var columns=null, rows=[];
    t.querySelectorAll('tr').forEach(function(tr){
      var cells=[].map.call(tr.children,cellText);
      if(!cells.some(Boolean)) return;
      if(!columns && [].every.call(tr.children,function(c){return c.tagName==='TH';})) columns=cells; else rows.push(cells);
    });
    if(!columns && rows.length) columns=rows.shift();
    var cap=t.querySelector('caption'), h=t.closest('section,.card');
    var title=(cap&&cap.innerText)||(h&&h.querySelector('h1,h2,h3,h4')&&h.querySelector('h1,h2,h3,h4').innerText)||document.title;
    return {type:'insert-table',caption:clean(title).slice(0,120),columns:columns||[],rows:rows};
  }
  function fromElement(el){
    var t=el.closest('table'); if(t) return fromTable(t);
    var text=clean(el.innerText); if(!text) return null;
    return {type:'insert-text',text:text};
  }
  var BLOCKS='[class*="result"],[class*="summary"],[class*="output"]';
  function targetOf(node){
    if(!node||!node.closest||node.closest('#elabPick')) return null;
    var el=node.closest(TARGETS); if(!el||el.tagName==='TABLE') return el;
    // a value inside a result block: take the whole block (not when that is most of the page)
    for(var up=el.parentElement&&el.parentElement.closest(BLOCKS); up&&up!==document.body&&clean(up.innerText).length<1500; up=up.parentElement&&up.parentElement.closest(BLOCKS)) el=up;
    return el;
  }
  function setHot(el){ if(hot) hot.classList.remove('elab-pick-target'); hot=el; if(hot) hot.classList.add('elab-pick-target'); }
  function stop(){ picking=false; setHot(null); pick.classList.remove('on'); pick.textContent='Pick → eLabFTW'; note.style.display='none'; }
  pick.addEventListener('click',function(e){
    e.stopPropagation();
    if(picking){ stop(); return; }
    picking=true; pick.classList.add('on'); pick.textContent='Cancel';
    note.textContent='Click a table or result to insert it (Esc cancels)'; note.style.display='';
  });
  document.addEventListener('mouseover',function(e){ if(picking) setHot(targetOf(e.target)); },true);
  document.addEventListener('click',function(e){
    if(!picking||e.target.closest('#elabPick')) return;
    e.preventDefault(); e.stopPropagation();
    var el=targetOf(e.target); var m=el&&fromElement(el); stop();
    if(m){ send(m); say(m.type==='insert-table'?'Table sent':'Text sent'); } else say('Nothing to insert there');
  },true);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&picking) stop(); });
  document.addEventListener('selectionchange',function(){ sel.style.display=clean(String(window.getSelection()))?'':'none'; });
  sel.addEventListener('mousedown',function(e){ e.preventDefault(); });
  sel.addEventListener('click',function(){ var s=window.getSelection(), text=clean(String(s)); if(text){ send({type:'insert-text',text:text}); say('Text sent'); } });
  // ── inventory search: the page searches with the user's own session and sends the entries back ──
  var pending={}, counter=0;
  window.addEventListener('message',function(e){
    var d=e.data; if(e.source!==window.parent||!d||d.elabftw!==1||(d.type!=='items'&&d.type!=='items-error')||!pending[d.requestId]) return;
    var p=pending[d.requestId]; delete pending[d.requestId];
    if(d.type==='items') p.ok(d.items||[]); else p.fail(new Error(d.message||'Search failed'));
  });
  window.elabftwSearchItems=function(query,opts){
    opts=opts||{};
    return new Promise(function(ok,fail){
      var id='r'+(++counter); pending[id]={ok:ok,fail:fail};
      post({type:'search-items',requestId:id,query:query,category:opts.category||'',limit:opts.limit||20});
      setTimeout(function(){ if(pending[id]){ delete pending[id]; fail(new Error('No answer from eLabFTW')); } },15000);
    });
  };
  // a search box with the matching entries; resolves with the chosen entry ({id,title,category,url,fields}) or null
  window.elabftwPickItem=function(opts){
    opts=opts||{};
    return new Promise(function(done){
      var back=document.createElement('div');
      back.style.cssText='position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;font:14px/1.4 system-ui,sans-serif';
      var card=document.createElement('div');
      card.style.cssText='background:#fff;color:#111827;border-radius:10px;width:min(560px,92vw);max-height:76vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.4)';
      var head=document.createElement('div'); head.style.cssText='padding:12px 14px;font-weight:600;border-bottom:1px solid #e5e7eb';
      head.textContent=opts.title||'Search the inventory'+(opts.category?' ('+opts.category+')':'');
      var box=document.createElement('input'); box.type='search'; box.placeholder='Type to search…';
      box.style.cssText='margin:10px 14px;padding:8px 10px;border:1px solid #9ca3af;border-radius:6px;font:inherit;color:#111827;background:#fff';
      var list=document.createElement('div'); list.style.cssText='overflow:auto;padding:0 8px 10px';
      card.append(head,box,list); back.appendChild(card); document.body.appendChild(back); box.focus();
      var timer=0, token=0;
      function close(v){ document.removeEventListener('keydown',key,true); back.remove(); done(v); }
      function key(e){ if(e.key==='Escape'){ e.stopPropagation(); close(null); } }
      document.addEventListener('keydown',key,true);
      back.addEventListener('mousedown',function(e){ if(e.target===back) close(null); });
      function show(items){
        list.textContent='';
        if(!items.length){ var none=document.createElement('div'); none.style.cssText='padding:10px 8px;color:#6b7280'; none.textContent='Nothing found'; list.appendChild(none); return; }
        items.forEach(function(it){
          var row=document.createElement('button'); row.type='button';
          row.style.cssText='display:block;width:100%;text-align:left;padding:8px;border:0;border-radius:6px;background:none;color:inherit;font:inherit;cursor:pointer';
          row.onmouseenter=function(){ row.style.background='#eff6ff'; }; row.onmouseleave=function(){ row.style.background='none'; };
          var t=document.createElement('div'); t.style.fontWeight='600'; t.textContent=it.title;
          var sub=document.createElement('div'); sub.style.cssText='font-size:12px;color:#6b7280';
          sub.textContent=[it.category].concat(Object.keys(it.fields||{}).slice(0,4).map(function(k){ return it.fields[k]?k+': '+it.fields[k]:''; })).filter(Boolean).join(' · ');
          row.append(t,sub); row.onclick=function(){ close(it); }; list.appendChild(row);
        });
      }
      function run(){
        var mine=++token;
        window.elabftwSearchItems(box.value,{category:opts.category}).then(function(items){ if(mine===token) show(items); })
          .catch(function(err){ if(mine===token){ list.textContent=err.message; } });
      }
      box.addEventListener('input',function(){ clearTimeout(timer); timer=setTimeout(run,250); });
      run();
    });
  };
  window.elabftwSend=send;   // tool-specific buttons use this
  window.elabftwNote=say;
})();
</script>
